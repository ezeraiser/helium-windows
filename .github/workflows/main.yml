name: Build and release binaries
on:
  workflow_dispatch:
    inputs:
      arch:
        required: true
        type: choice
        description: 'Select architecture to build'
        options:
          - x86_64
          - arm64
      runner:
        required: false
        description: 'Runner image name'
        default: 'windows-2025'
      do-release:
        required: false
        type: boolean
        description: 'Create a release after build is done'
        default: false
      ntfs-compression:
        required: false
        type: boolean
        description: 'Use NTFS compression on the build directory (saves disk space, costs build time)'
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.arch }}
    uses: ./.github/workflows/build-steps.yml
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_CERTIFICATE_NAME: ${{ secrets.AZURE_SIGNING_CERTIFICATE_NAME }}
    with:
      arch: ${{ inputs.arch }}
      runs-on: ${{ inputs.runner }}
      ntfs-compression: ${{ inputs.ntfs-compression }}

  publish-release:
    needs: build
    if: ${{ inputs.do-release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true
      - name: Get release version
        id: version
        shell: bash
        run: |
          version=$(python3 helium-chromium/utils/helium_version.py --print --tree helium-chromium --platform-tree .)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/release
        with:
          version: ${{ steps.version.outputs.version }}
          arch: ${{ inputs.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
