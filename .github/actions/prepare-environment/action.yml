name: Prepare Windows build environment
description: Set up Python, the Windows SDK, the build directory, and stage dependencies
runs:
  using: composite
  steps:
    - name: Record job start
      shell: pwsh
      run: '"HELIUM_JOB_STARTED_AT=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'
    - name: Free disk space
      shell: pwsh
      run: |
        Write-Host "=== Before cleanup ==="
        Get-PSDrive C | Select-Object Used, Free

        # Unused hosted-tool SDKs the Chromium build never touches. Left alone:
        # Python/Node.js under hostedtoolcache (needed by our own setup steps below)
        # and the Windows SDK / MSVC toolchain (needed by the build itself).
        # Only the large ones are listed: the rest (SQL Server, Firefox, Chrome, Ruby, go,
        # Selenium drivers, ...) add up to ~2 GB and cost far more time than they free.
        $dirs = @(
          "C:\Program Files (x86)\Android",
          "C:\Program Files\dotnet",
          "C:\Program Files\Java",
          "C:\hostedtoolcache\windows\Java_Temurin-Hotspot",
          "C:\ProgramData\chocolatey\lib",
          # Preinstalled runner software the build never uses. Chromium downloads its
          # own clang/rust into third_party (see build.py), and clang-format comes from pip.
          "C:\Program Files\LLVM",
          "C:\Program Files\PostgreSQL",
          "C:\Program Files\MongoDB",
          "C:\Julia",
          "C:\Strawberry",
          "C:\Rtools"
        )
        foreach ($dir in $dirs) {
          if (Test-Path $dir) {
            Write-Host "Removing: $dir"
            # cmd's rmdir is several times faster than Remove-Item -Recurse on trees with
            # many small files. Sizes are deliberately not measured: enumerating every
            # file just to log a number was a large part of this step's runtime.
            cmd /c rmdir /s /q "$dir"
          }
        }
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:TEMP\*"

        Write-Host "=== After cleanup ==="
        Get-PSDrive C | Select-Object Used, Free
        # Best-effort cleanup: a failed rmdir must not fail the step via the last exit code.
        $global:LASTEXITCODE = 0
    - name: Clean temp and system temp directories
      shell: pwsh
      run: |
        Write-Host "=== Cleaning temp directories ==="
        try {
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Cleaned $env:TEMP" -ForegroundColor Green
        } catch {
          Write-Host "Warning: Could not clean $env:TEMP: $_" -ForegroundColor Yellow
        }
        
        try {
          Remove-Item -Path "$env:SystemRoot\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Cleaned $env:SystemRoot\Temp" -ForegroundColor Green
        } catch {
          Write-Host "Warning: Could not clean system temp: $_" -ForegroundColor Yellow
        }
        Get-PSDrive C | Select-Object Used, Free
    - name: Clear Event Logs
      shell: pwsh
      run: |
        Write-Host "=== Clearing Event Logs ==="
        try {
          $logNames = @(
            "Application",
            "System",
            "Security",
            "Setup",
            "ForwardedEvents"
          )
          foreach ($logName in $logNames) {
            try {
              Clear-EventLog -LogName $logName -ErrorAction SilentlyContinue
              Write-Host "Cleared $logName log" -ForegroundColor Green
            } catch {
              Write-Host "Warning: Could not clear $logName log: $_" -ForegroundColor Yellow
            }
          }
        } catch {
          Write-Host "Warning: Event log cleanup encountered an error: $_" -ForegroundColor Yellow
        }
        Get-PSDrive C | Select-Object Used, Free
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install Windows SDK 10.0.28000.0
      shell: pwsh
      run: |
        if (Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.28000.0\um\Windows.h") { exit 0 }
        Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2370315' -OutFile "$env:RUNNER_TEMP\winsdksetup.exe"
        $installer = Start-Process "$env:RUNNER_TEMP\winsdksetup.exe" -ArgumentList '/quiet', '/norestart', '/features', '+' -Wait -PassThru
        if ($installer.ExitCode -notin @(0, 3010)) { throw "Windows SDK installation failed: $($installer.ExitCode)" }
    - name: Cleanup SDK installer
      shell: pwsh
      run: |
        Write-Host "Cleaning up Windows SDK installer"
        Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\winsdksetup.exe"
        Write-Host "=== After SDK installer cleanup ==="
        Get-PSDrive C | Select-Object Used, Free
    - name: Init
      shell: pwsh
      run: |
        if (Test-Path "C:\helium-windows") {
          Remove-Item "C:\helium-windows" -Recurse -Force -ErrorAction SilentlyContinue
        }
        Copy-Item -Path . -Destination "C:\helium-windows" -Recurse
    - name: Cleanup workspace copy after init
      shell: pwsh
      run: |
        Write-Host "Cleaning up GitHub workspace after copying to C:\helium-windows"
        # Remove the duplicate checkout in workspace since we now have C:\helium-windows
        if ("$env:GITHUB_WORKSPACE" -ne "C:\helium-windows") {
          Get-ChildItem "$env:GITHUB_WORKSPACE" -Force -Recurse -ErrorAction SilentlyContinue | 
            Where-Object { -not ($_.PSPath -like "*\.git*") } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        }
        Write-Host "=== After workspace cleanup ==="
        Get-PSDrive C | Select-Object Used, Free
    - name: Set up Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: '24'
    - name: Setup Stage
      shell: pwsh
      run: npm ci
      working-directory: ./.github/actions/stage
